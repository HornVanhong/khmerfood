spring:
  application:
    name: khmerfood-backend-test
  datasource:
    url: jdbc:h2:mem:khmerfood_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

server:
  port: 0

cors:
  allowed-origins: http://localhost:3000
