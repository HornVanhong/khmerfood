version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: khmerfood-postgres
    restart: always
    environment:
      POSTGRES_DB: khmerfood_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khmerfood_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khmerfood-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/khmerfood_db
      DB_USERNAME: postgres
      DB_PASSWORD: change_me_password
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: khmerfood-frontend
    restart: always
    depends_on:
      - backend
    environment:
      INTERNAL_API_URL: http://backend:8080/api/v1
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_DEFAULT_LOCALE: km
    ports:
      - "80:3000"
      - "3000:3000"

volumes:
  postgres_data:
